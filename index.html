/* v1.4.0 — glassmorphism system inspired by the supplied Finora reference.
   Keep translucency restrained on data-dense areas for financial readability. */
:root{--glass-white:rgba(255,255,255,.68);--glass-border:rgba(255,255,255,.72);--glass-shadow:0 18px 54px rgba(57,44,117,.10),inset 0 1px 0 rgba(255,255,255,.72);--glass-blur:blur(22px) saturate(158%)}
:root[data-theme="dark"]{--glass-white:rgba(29,27,48,.66);--glass-border:rgba(255,255,255,.12);--glass-shadow:0 18px 54px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.08)}
html{background:var(--bg)}
body{background:radial-gradient(ellipse at 8% 2%,color-mix(in srgb,var(--primary) 20%,transparent) 0,transparent 38%),radial-gradient(ellipse at 92% 12%,rgba(157,119,255,.19) 0,transparent 32%),radial-gradient(ellipse at 56% 96%,rgba(69,169,195,.10) 0,transparent 38%),var(--bg);background-attachment:fixed}
.sidebar,.topbar,.card,.modal,.notification-panel,.popover,.range-popover,.profile-hero,.profile-nav,.profile-panel,.settings-nav,.settings-content{background:var(--glass-white);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-color:var(--glass-border);box-shadow:var(--glass-shadow)}
.sidebar{background:color-mix(in srgb,var(--surface) 68%,transparent);border-right-color:color-mix(in srgb,var(--line) 65%,transparent)}
.topbar{background:color-mix(in srgb,var(--surface) 64%,transparent);border-bottom-color:color-mix(in srgb,var(--line) 66%,transparent)}
.card{border:1px solid var(--glass-border);box-shadow:var(--glass-shadow),0 8px 26px rgba(45,38,93,.035);overflow:hidden}
.stat-card,.profile-hero{background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 80%,transparent),color-mix(in srgb,var(--primary-soft) 53%,transparent));}
.nav-item.active,.profile-tab.active,.settings-tab.active{background:color-mix(in srgb,var(--primary-soft) 76%,transparent);border-color:color-mix(in srgb,var(--primary) 16%,transparent)}
.btn,.select-control,.text-control,.global-search,.language-control,.icon-button,.filter-search{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn:not(.btn-primary):not(.btn-danger){background:color-mix(in srgb,var(--surface) 64%,transparent);border-color:color-mix(in srgb,var(--line) 76%,transparent)}
.btn-primary{box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 24%,transparent);background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.modal-layer{background:rgba(29,24,56,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.upgrade-card{background:linear-gradient(135deg,color-mix(in srgb,var(--primary-soft) 80%,transparent),color-mix(in srgb,var(--surface) 57%,transparent));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:color-mix(in srgb,var(--primary) 20%,var(--glass-border))}
.merchant-card,.budget-card,.forecast-card,.commitment-card,.chart-card,.table-card,.calendar-card,.calendar-side,.profile-security-notice,.profile-data-callout{backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.transaction-row,.settings-row,.profile-provider-row,.profile-data-action{border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.settings-content,.settings-nav,.profile-panel,.profile-nav{border-radius:20px}
[data-theme="dark"] body{background:radial-gradient(ellipse at 8% 2%,color-mix(in srgb,var(--primary) 22%,transparent) 0,transparent 38%),radial-gradient(ellipse at 92% 12%,rgba(129,84,235,.15) 0,transparent 32%),var(--bg);background-attachment:fixed}
[data-accent="blue"]{--primary:#3478f6;--primary-2:#5a93ff;--primary-soft:#e8f0ff}
[data-theme="dark"][data-accent="blue"]{--primary:#83afff;--primary-2:#a1c1ff;--primary-soft:#202f4e}
[data-accent="teal"]{--primary:#0f9588;--primary-2:#2ab3a5;--primary-soft:#e3f7f4}
[data-theme="dark"][data-accent="teal"]{--primary:#63d4c8;--primary-2:#83e5d9;--primary-soft:#183a37}
[data-accent="amber"]{--primary:#c97308;--primary-2:#e89525;--primary-soft:#fff1da}
[data-theme="dark"][data-accent="amber"]{--primary:#ffc16d;--primary-2:#ffd08e;--primary-soft:#3b2d1c}
[data-density="compact"] .stat-card{padding:14px 15px 12px}
[data-density="compact"] .card-header{padding-top:15px;padding-bottom:12px}
[data-density="compact"] .card-content{padding-top:12px;padding-bottom:12px}
[data-density="compact"] .transaction-row{padding-top:9px;padding-bottom:9px}
[data-density="compact"] .settings-row{padding-top:12px;padding-bottom:12px}
[data-density="compact"] .page-wrap{padding-top:26px}
[data-density="compact"] .grid{gap:12px}
.appearance-block{padding:20px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 76%,transparent)}
.appearance-block-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:13px}
.appearance-block-heading h3{font:700 13px/1.35 var(--display);margin:0;color:var(--text)}
.appearance-block-heading p{font-size:10px;color:var(--muted);margin:5px 0 0;line-height:1.5}
.appearance-theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.appearance-choice{position:relative;display:flex;align-items:center;gap:10px;min-height:58px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:13px;color:var(--text-2);background:color-mix(in srgb,var(--surface) 48%,transparent);transition:border-color .16s,background .16s,transform .16s}
.appearance-choice>svg{width:17px;height:17px;color:var(--text-2);flex:0 0 auto}.appearance-choice span{font-size:11px;font-weight:650}.appearance-choice i{margin-left:auto;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-style:normal}.appearance-choice i svg{width:12px;height:12px}
.appearance-choice:hover,.density-choice:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 44%,var(--line))}
.appearance-choice.active,.density-choice.active{border-color:color-mix(in srgb,var(--primary) 65%,var(--line));background:color-mix(in srgb,var(--primary-soft) 69%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 11%,transparent)}
.accent-swatches{display:flex;flex-wrap:wrap;gap:11px}
.accent-choice{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:69px;padding:4px 5px 7px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--text);font-size:10px;font-weight:600}
.accent-dot{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--swatch);color:#fff;border:3px solid color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--swatch) 15%,transparent);transition:box-shadow .16s,transform .16s}
.accent-dot svg{width:19px;height:19px;stroke-width:2.4}
.accent-choice.active .accent-dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--swatch);transform:scale(1.03)}
.accent-choice:hover .accent-dot{transform:translateY(-2px)}

/* Ledgerly Finance Core — deterministic money calculations shared by every view.
 * Amounts are converted to integer minor units for arithmetic. This prototype
 * assumes the user's selected display currency is also the unit entered for a
 * transaction; it intentionally does not perform FX conversion.
 */
(function (root, factory) {

  const toMinor = value => {
    const n = Number(value);

  };
  const fromMinor = value => Number(value || 0) / 100;
  const sumMinor = (values, selector = value => value) => values.reduce((sum, value) => sum + toMinor(selector(value)), 0);

    const status = String(tx?.status || 'paid').toLowerCase();

  };
  const isCancelled = tx => ['cancelled', 'canceled', 'void', 'annullata'].includes(String(tx?.status || '').toLowerCase());
  const inRange = (tx, from = '', to = '') => Boolean(tx?.date) && (!from || tx.date >= from) && (!to || tx.date <= to);
  const signedCashflowMinor = tx => {
    if (!isPosted(tx) || isCancelled(tx)) return 0;
    const amount = Math.abs(toMinor(tx.amount));
    if (tx.type === 'income' || tx.type === 'refund') return amount;
    if (tx.type === 'expense') return -amount;
    // Internal transfers only move money between pockets, not in/out of the overall position.
    return 0;
  };
  function summarize(transactions, { from = '', to = '', postedOnly = true } = {}) {
    const rows = transactions.filter(tx => inRange(tx, from, to) && (!postedOnly || isPosted(tx)) && !isCancelled(tx));
    const expenseCents = sumMinor(rows.filter(tx => tx.type === 'expense'), tx => Math.abs(Number(tx.amount) || 0));
    const incomeCents = sumMinor(rows.filter(tx => tx.type === 'income'), tx => Math.abs(Number(tx.amount) || 0));
    const refundCents = sumMinor(rows.filter(tx => tx.type === 'refund'), tx => Math.abs(Number(tx.amount) || 0));
    const transferCents = sumMinor(rows.filter(tx => tx.type === 'transfer'), tx => Math.abs(Number(tx.amount) || 0));
    const netExpenseCents = expenseCents - refundCents;
    const netCashflowCents = incomeCents + refundCents - expenseCents;
    return {
      count: rows.length,
      expense: fromMinor(expenseCents), income: fromMinor(incomeCents), refund: fromMinor(refundCents),
      transfer: fromMinor(transferCents), netExpense: fromMinor(netExpenseCents),
      netCashflow: fromMinor(netCashflowCents),

    const from = `${month}-01`;

  function activeBudgets(budgets, month) {
    const candidates = budgets.filter(b => !b.month || b.month === month);
    const chosen = new Map();
    for (const b of candidates) {
      const prior = chosen.get(b.categoryId);

    const unique = activeBudgets(budgets, month);
    const totals = categorySpending(transactions, month);
    const spendMap = new Map(totals.map(row => [row.id, row.cents]));
    const categories = unique.map(b => {
      const limitCents = Math.max(0, toMinor(b.limit));
      const spentCents = Math.max(0, spendMap.get(b.categoryId) || 0);

    const { from, days } = monthBounds(today.slice(0, 7));

    const allPostedToDate = transactions.filter(tx => inRange(tx, '', today) && isPosted(tx) && !isCancelled(tx));
    const currentBalanceCents = toMinor(startingBalance) + allPostedToDate.reduce((sum, tx) => sum + signedCashflowMinor(tx), 0);

    const incomeCents = actual.incomeCents;
    const projectedIncomeCents = remainingDays ? Math.round(incomeCents / Math.max(elapsedDays, 1) * remainingDays) : 0;
    const projectedNonSubscriptionExpenseCents = remainingDays ? Math.round(nonSubscriptionExpenseCents / Math.max(elapsedDays, 1) * remainingDays) : 0;
    const monthEnd = `${today.slice(0, 7)}-${String(days).padStart(2, '0')}`;
    const plannedRows = transactions.filter(tx => tx.date > today && tx.date <= monthEnd && !isPosted(tx) && !isCancelled(tx));

    const projectedNetCents = projectedIncomeCents - projectedNonSubscriptionExpenseCents - subscriptionCents + plannedCents;
    return {
      balanceNow: fromMinor(currentBalanceCents), estimatedMonthEnd: fromMinor(currentBalanceCents + projectedNetCents),
      projectedIncome: fromMinor(projectedIncomeCents), projectedNonSubscriptionExpenses: fromMinor(projectedNonSubscriptionExpenseCents),
      upcomingSubscriptionPayments: fromMinor(subscriptionCents), plannedNet: fromMinor(plannedCents),
      elapsedDays, remainingDays, daysInMonth: days, monthToDate: actual, hasHistory: todayRows.length > 0,
      projectedNet: fromMinor(projectedNetCents), method: 'linear run-rate plus known future transactions and subscription renewals'
    };
  }
  return Object.freeze({ toMinor, fromMinor, sumMinor, isPosted, isCancelled, signedCashflowMinor, summarize, categorySpending, activeBudgets, budgetSummary, monthBounds, comparableMonthToDate, monthForecast });
});

  function renderCashflowChart(count=6){const months=getChartMonths(count),hasAny=months.some(m=>m.expense!==0||m.income!==0);if(!hasAny)return `<div class="chart-empty">${t('noDataText')}</div>`;const max=Math.max(1,...months.map(m=>Math.max(m.expense,m.income)))*1.18,w=620,h=218,left=8,right=8,top=13,bottom=10,innerW=w-left-right,innerH=h-top-bottom;const x=i=>left+(months.length===1?innerW/2:i*innerW/(months.length-1));const y=v=>top+innerH-(v/max*innerH);const pathFor=key=>{let d='',open=false;months.forEach((m,i)=>{const value=m[key];if(value===0){open=false;return}d+=`${open?' L':' M'} ${x(i)} ${y(value)}`;open=true});return d.trim()};const points=pathFor('expense'),incomePoints=pathFor('income');return `<div class="chart-area"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(t('cashFlow'))}"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--primary)" stop-opacity=".18"/><stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>${[0,.33,.66,1].map(p=>`<line class="chart-grid-line" x1="${left}" y1="${top+innerH*p}" x2="${w-right}" y2="${top+innerH*p}"/>`).join('')}<path d="${points?`${points} L ${x(months.length-1)} ${h-bottom} L ${x(0)} ${h-bottom} Z`:''}" fill="url(#areaFill)" stroke="none"/><path d="${points}" stroke="var(--primary)" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${incomePoints}" stroke="var(--green)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>${months.map((m,i)=>`${m.expense>0?`<circle cx="${x(i)}" cy="${y(m.expense)}" r="3" fill="var(--surface)" stroke="var(--primary)" stroke-width="2"><title>${esc(m.label)} · ${esc(t('expense'))}: ${esc(money(m.expense))}</title></circle>`:''}${m.income>0?`<circle cx="${x(i)}" cy="${y(m.income)}" r="3" fill="var(--surface)" stroke="var(--green)" stroke-width="2"><title>${esc(m.label)} · ${esc(t('income'))}: ${esc(money(m.income))}</title></circle>`:''}`).join('')}</svg><div class="chart-tooltip" id="chartTooltip"></div></div><div class="inline-actions" style="margin-top:12px;gap:14px"><span style="display:flex;align-items:center;gap:6px;font-size:9px;color:var(--text-2)"><i class="legend-dot" style="background:var(--primary)"></i>${t('expense')}</span><span style="display:flex;align-items:center;gap:6px;font-size:9px;color:var(--text-2)"><i class="legend-dot" style="background:var(--green)"></i>${t('income')}</span><span class="spacer"></span><span style="font-size:9px;color:var(--muted)">${t('recordedOnly')}</span></div>`}

    `}

  function renderMerchants(){const list=[...state.merchants].sort((a,b)=>a.name.localeCompare(b.name));return `${heading(t('merchantsTitle'),t('merchantsSubtitle'),t('addMerchant'),'new-merchant',`<button class="btn" data-action="export-csv">${icon('download')}${t('exportCsv')}</button>`)}

    <div class="alert-panel" style="margin-top:16px">${icon('info')}<div>${t('websiteHint')}</div></div>`}

  function renderCategories(){const list=[...state.categories].sort((a,b)=>(a.type||'').localeCompare(b.type||'')||catLabel(a).localeCompare(catLabel(b)));return `${heading(t('categoriesTitle'),t('categoriesSubtitle'),t('addCategory'),'new-category')}

  function renderCategoryCard(c){const usage=state.transactions.filter(tx=>tx.categoryId===c.id).length;return `<div class="card category-card"><div class="category-symbol" style="background:color-mix(in srgb,${esc(catColor(c))} 15%,var(--surface));color:${esc(catColor(c))}">${esc(c.icon||'◈')}</div><div class="category-copy"><strong>${esc(catLabel(c))}</strong><span>${usage} ${t('categoryUsage').toLowerCase()} · ${c.system?t('systemCategory'):t('customCategory')}</span></div><button class="row-action" data-action="edit-category" data-id="${c.id}" aria-label="${t('edit')}">${icon('edit')}</button>${!c.system?`<button class="row-action" data-action="delete-category" data-id="${c.id}" aria-label="${t('delete')}">${icon('trash')}</button>`:''}</div>`}

  function eventsOn(date){const tx=state.transactions.filter(x=>x.date===date);const subs=activeSubs().filter(s=>s.nextDate===date);return [...tx.map(x=>({kind:'transaction',date,transaction:x})),...subs.map(x=>({kind:'subscription',date,subscription:x}))]}
  function renderCalendar(){const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),start=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),offset=(start.getDay()+6)%7,prevDays=new Date(y,m,0).getDate(),days=Array.from({length:Math.ceil((offset+daysIn)/7)*7},(_,i)=>{const n=i-offset+1;if(n<1)return{day:prevDays+n,month:-1,date:isoDate(new Date(y,m-1,prevDays+n))};if(n>daysIn)return{day:n-daysIn,month:1,date:isoDate(new Date(y,m+1,n-daysIn))};return{day:n,month:0,date:isoDate(new Date(y,m,n))}});const events=eventsOn(selectedCalendarDate);const daysNames=['weekdayMon','weekdayTue','weekdayWed','weekdayThu','weekdayFri','weekdaySat','weekdaySun'];const upcoming=activeSubs().filter(s=>s.nextDate>=isoDate(new Date())).sort((a,b)=>a.nextDate.localeCompare(b.nextDate)).slice(0,5);return `${heading(t('calendarTitle'),t('calendarSubtitle'))}<div class="calendar-layout"><section class="card calendar-card"><div class="calendar-month-nav"><button class="icon-button" data-action="calendar-prev" aria-label="${t('previousMonth')}">${icon('chevron-left')}</button><strong>${esc(monthFmt(calendarCursor))}</strong><div class="inline-actions"><button class="btn btn-sm" data-action="calendar-today">${t('today')}</button><button class="icon-button" data-action="calendar-next" aria-label="${t('nextMonth')}">${icon('chevron-right')}</button></div></div><div class="calendar-days">${daysNames.map(k=>`<div class="calendar-weekday">${t(k)}</div>`).join('')}${days.map(day=>{const es=eventsOn(day.date);return `<button class="calendar-day ${day.month?'other-month':''} ${day.date===isoDate(new Date())?'today':''} ${day.date===selectedCalendarDate?'selected':''}" data-action="calendar-select" data-date="${day.date}" aria-label="${esc(dateFmt(day.date))}"><span>${day.day}</span><div class="calendar-event-dots">${es.slice(0,3).map(e=>`<i style="background:${e.kind==='subscription'?'var(--orange)':(e.transaction.status==='planned'?'var(--orange)':e.transaction.status==='cancelled'?'var(--muted)':(e.transaction.type==='income'||e.transaction.type==='refund')?'var(--green)':'var(--primary)')}"></i>`).join('')}</div></button>`}).join('')}</div></section><section class="card calendar-side">${cardHeader(t('selectedDate'),dateFmt(selectedCalendarDate,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}<div class="card-content" style="padding-left:0;padding-right:0"><div class="subscription-list">${events.length?events.map(e=>e.kind==='subscription'?`<div class="transaction-row"><div class="merchant-mark generic">${icon('repeat')}</div><div class="transaction-info"><strong>${esc(e.subscription.name)}</strong><span>${t('renewalReminder')} · ${t('subscription')}</span></div><div class="transaction-amount"><strong>${money(e.subscription.amount)}</strong><span>${frequencyLabel(e.subscription.frequency)}</span></div></div>`:renderTransactionLine(e.transaction)).join(''):emptyState(t('noEvents'),t('noEventsText'),'',null,'calendar')}</div><div class="divider"></div><div class="section-head" style="margin:0 0 12px"><h2>${t('upcomingThisMonth')}</h2></div>${upcoming.length?upcoming.map(s=>`<div class="transaction-row"><div class="subscription-due"><strong>${new Date(`${s.nextDate}T12:00:00`).getDate()}</strong><span>${esc(new Intl.DateTimeFormat({it:'it-IT',en:'en-GB',es:'es-ES'}[state.settings.lang],{month:'short'}).format(new Date(`${s.nextDate}T12:00:00`)))}</span></div><div class="transaction-info"><strong>${esc(s.name)}</strong><span>${esc(dateFmt(s.nextDate))}</span></div><div class="transaction-amount"><strong>${money(s.amount)}</strong></div></div>`).join(''):`<div class="empty-inline">${t('noDuePayments')}</div>`}</div></section></div>`}

    if(profileTab==='finance')panel=`<section class="card profile-panel"><div class="profile-panel-heading"><div><h2>${t('financialProfileTitle')}</h2><p>${t('financialProfileDesc')}</p></div></div><form id="profileFinanceForm"><div class="settings-row"><div class="settings-row-info"><strong>${t('language')}</strong><p>${t('languageHint')}</p></div><select class="select-control" id="profileLanguage" name="lang"><option value="it" ${state.settings.lang==='it'?'selected':''}>Italiano</option><option value="en" ${state.settings.lang==='en'?'selected':''}>English</option><option value="es" ${state.settings.lang==='es'?'selected':''}>Español</option></select></div><div class="settings-row"><div class="settings-row-info"><strong>${t('currency')}</strong><p>${t('currencyHint')}</p></div><select class="select-control" id="profileCurrency" name="currency"><option value="EUR" ${state.settings.currency==='EUR'?'selected':''}>EUR · €</option><option value="USD" ${state.settings.currency==='USD'?'selected':''}>USD · $</option><option value="GBP" ${state.settings.currency==='GBP'?'selected':''}>GBP · £</option></select></div><div class="settings-row"><div class="settings-row-info"><strong>${t('timezone')}</strong><p>${t('timezoneDesc')}</p></div><select class="select-control" id="profileTimezone" name="timezone"><option value="Europe/Rome" ${p.timezone==='Europe/Rome'?'selected':''}>${t('timezoneRome')}</option><option value="Europe/London" ${p.timezone==='Europe/London'?'selected':''}>${t('timezoneLondon')}</option><option value="Europe/Madrid" ${p.timezone==='Europe/Madrid'?'selected':''}>${t('timezoneMadrid')}</option><option value="UTC" ${p.timezone==='UTC'?'selected':''}>${t('timezoneUtc')}</option></select></div><div class="settings-row"><div class="settings-row-info"><strong>${t('appearance')}</strong><p>${t('themeHint')}</p></div><select class="select-control" id="profileTheme" name="theme"><option value="light" ${state.settings.theme==='light'?'selected':''}>${t('lightTheme')}</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>${t('darkTheme')}</option><option value="system" ${state.settings.theme==='system'?'selected':''}>${t('systemTheme')}</option></select></div><div class="profile-form-actions"><span></span><button class="btn btn-primary" type="submit">${icon('check')}${t('saveFinancialPreferences')}</button></div></form></section>`;

  function openTransactionModal(id=null,clone=false){const original=id?state.transactions.find(x=>x.id===id):null;const tx=original?{...original}: {id:'',date:isoDate(new Date()),description:'',amount:'',type:'expense',merchantId:'',categoryId:'cat-food',accountId:'current',notes:'',status:'paid'};if(clone){tx.id='';tx.date=isoDate(new Date());tx.description=tx.description?`${tx.description} (${t('duplicate')})`:''}let selectedType=tx.type||'expense';const types=[['expense','expense'],['income','income'],['refund','refund'],['transfer','transfer']];const typeIcons={expense:'expense',income:'income',refund:'arrowUp',transfer:'arrowLeftRight'};modalOpen(`${modalHead(clone?t('duplicate'):original?t('editTransaction'):t('addTransaction'),t('transactionSubtitle'))}<form id="transactionForm" novalidate><div class="modal-body"><div class="type-picker">${types.map(([v,k])=>`<button type="button" class="type-option ${selectedType===v?'active':''}" data-action="type-select" data-type="${v}">${icon(typeIcons[v])}<span>${t(k)}</span></button>`).join('')}</div><input type="hidden" name="type" value="${esc(selectedType)}"/><div class="form-grid"><div class="form-field span-2" id="amountField"><label for="txAmount">${t('amount')} (${state.settings.currency}) *</label><input class="amount-field" id="txAmount" name="amount" inputmode="decimal" placeholder="0,00" value="${tx.amount!==''?esc(String(tx.amount).replace('.',',')):''}"/><div class="form-error">${t('validAmount')}</div></div><div class="form-field span-2" id="descriptionField"><label for="txDescription">${t('transactionName')} *</label><input id="txDescription" name="description" placeholder="${t('descriptionPlaceholder')}" value="${esc(tx.description)}"/><div class="form-error">${t('requiredField')}</div></div><div class="form-field"><label for="txDate">${t('transactionDate')} *</label><input type="date" id="txDate" name="date" value="${esc(tx.date)}"/><div class="form-error">${t('invalidDate')}</div></div><div class="for   function parseCsv(text){const first=String(text).split(/\r?\n/,1)[0]||'';let commas=0,semicolons=0,quoted=false;for(let i=0;i<first.length;i++){const ch=first[i];if(ch==='"'&&first[i+1]==='"'){i++;continue}if(ch==='"')quoted=!quoted;else if(!quoted&&ch===',')commas++;else if(!quoted&&ch===';')semicolons++}const delimiter=semicolons>commas?';':',';const rows=[];let row=[],field='',inQuotes=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(inQuotes){if(ch==='"'&&next==='"'){field+='"';i++}else if(ch==='"')inQuotes=false;else field+=ch}else{if(ch==='"')inQuotes=true;else if(ch===delimiter){row.push(field);field=''}else if(ch==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=ch}}if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()!==''))}

yncStatus='error';cloudSetStatus(error.message||cloudText('syncError'),'error');console.error('Ledgerly cloud workspace unavailable',error)}finally{cloudBootstrapBusy=false}}
  async function reloadCloudWorkspace(){if(!cloudSession?.user?.id||!cloudClient)return;const ok=window.confirm(cloudText('restoreConfirm'));if(!ok)return;try{exportBackup();const {data,error}=await cloudClient.from('workspace_snapshots').select('payload,schema_version,revision').eq('user_id',cloudSession.user.id).maybeSingle();if(error)throw error;if(!data)throw new Error(cloudText('syncError'));cloudApplyingRemote=true;state=normalizeState(data.payload);save();cloudApplyingRemote=false;cloudRevision=Number(data.revision)||1;cloudSyncConflict=false;cloudSyncReady=true;cloudSyncStatus='synced';renderApp();renderCloudModal();cloudSetStatus(cloudText('synced'),'success')}catch(error){cloudApplyingRemote=false;cloudSetStatus(error.message||cloudText('syncError'),'error')}}
  function renderCloudModal(){const old=$('#cloudModalLayer');if(!old)return;const configured=cloudConfigured(),session=cloudSession,lang=state?.settings?.lang||'it';const copy=CLOUD_COPY[lang]||CLOUD_COPY.it;const safeEmail=esc(session?.user?.email||'');let content='';if(!configured){content=`<div class="cloud-status-box" data-kind="warning">${esc(copy.notConfigured)}</div><div class="cloud-auth-buttons"><button class="btn" type="button" data-cloud-action="close">${esc(copy.close)}</button></div>`}else if(session){content=`<div class="cloud-account-summary"><div class="avatar">${esc(initials(session.user.email||'Ledgerly'))}</div><div><strong>${esc(copy.signedIn)}</strong><small>${safeEmail}</small></div><span class="badge ${cloudSyncStatus==='synced'?'success':cloudSyncStatus==='conflict'?'warning':'neutral'}">${esc(cloudSyncStatus==='synced'?copy.synced:cloudSyncStatus==='conflict'?copy.conflict:cloudSyncStatus==='syncing'?copy.syncing:copy.local)}</span></div><div id="cloudStatus" class="cloud-status-box" data-kind="${cloudSyncStatus==='synced'?'success':cloudSyncStatus==='conflict'?'warning':'info'}">${esc(cloudSyncStatus==='synced'?copy.synced:cloudSyncStatus==='conflict'?copy.conflict:cloudSyncStatus==='syncing'?copy.syncing:copy.syncLocal)}</div><div class="cloud-sync-actions"><button class="btn btn-primary" type="button" data-cloud-action="sync">${esc(copy.syncNow)}</button>${cloudSyncConflict?`<button class="btn" type="button" data-cloud-action="reload">${esc(copy.restoreCloud)}</button>`:''}<button class="btn" type="button" data-cloud-action="signout">${esc(copy.signout)}</button><button class="btn btn-quiet" type="button" data-cloud-action="close">${esc(copy.close)}</button></div><p class="cloud-sync-note">${esc(copy.conflictReload)} ${esc(copy.providerNote)}</p>`}else{content=`<div id="cloudStatus" class="cloud-status-box" data-kind="info">${esc(copy.cloudReady)}</div><form id="cloudAuthForm" class="cloud-auth-form"><div class="form-field"><label for="cloudEmail">${esc(copy.email)}</label><input id="cloudEmail" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="mario@example.com"/></div><div class="form-field"><label for="cloudPassword">${esc(copy.password)}</label><input id="cloudPassword" name="password" type="password" autocomplete="${cloudAuthMode==='login'?'current-password':'new-password'}" required minlength="8" maxlength="128"/></div><button class="btn btn-primary" type="submit">${esc(cloudAuthMode==='login'?copy.login:copy.signup)}</button></form><div class="cloud-auth-separator">${esc(copy.or)}</div><div class="cloud-auth-buttons"><button class="btn" type="button" data-cloud-action="google">${esc(copy.google)}</button><button class="btn" type="button" data-cloud-action="microsoft">${esc(copy.microsoft)}</button></div><div class="cloud-auth-footer"><button class="cloud-text-button" type="button" data-cloud-action="toggle-mode">${esc(cloudAuthMode==='login'?copy.switchSignup:copy.switchLogin)}</button><button class="cloud-text-button" type="button" data-cloud-action="forgot">${esc(copy.forgot)}</button><button class="cloud-text-button" type="button" data-cloud-action="close">${esc(copy.close)}</button></div><p class="cloud-sync-note">${esc(copy.providerNote)} ${esc(copy.syncLocal)}</p>`}old.innerHTML=`<section class="cloud-modal-card" role="dialog" aria-modal="true" aria-labelledby="cloudModalTitle"><div class="cloud-modal-head"><div><h2 id="cloudModalTitle">${esc(copy.title)}</h2><p>${esc(copy.subtitle)}</p></div><button type="button" class="icon-button" data-cloud-action="close" aria-label="${esc(copy.close)}">${icon('close')}</button></div><div class="cloud-modal-body">${content}</div></section>`;old.setAttribute('aria-hidden','false');const form=$('#cloudAuthForm',old);if(form)form.addEventListener('submit',async event=>{event.preventDefault();const email=String(new FormData(form).get('email')||'').trim(),password=String(new FormData(form).get('password')||'');const submit=form.querySelector('button[type="submit"]');if(submit)submit.disabled=true;cloudSetStatus(copy.loading,'info');try{const client=await getCloudClient();if(cloudAuthMode==='login'){const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;cloudSetStatus(copy.loginOk,'success')}else{const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});if(error)throw error;if(!data.session)cloudSetStatus(copy.checkEmail,'success');else cloudSetStatus(copy.loginOk,'success')}}catch(error){cloudSetStatus(error.message||copy.authFail,'error')}finally{if(submit)submit.disabled=false}})}
  async function openCloudAccount(){let layer=$('#cloudModalLayer');if(!layer){layer=document.createElement('div');layer.id='cloudModalLayer';layer.className='cloud-modal-layer';layer.setAttribute('aria-hidden','true');document.body.appendChild(layer)}layer.innerHTML=`<section class="cloud-modal-card" role="dialog" aria-modal="true"><div class="cloud-modal-head"><div><h2>${esc(cloudText('title'))}</h2><p>${esc(cloudText('subtitle'))}</p></div><button type="button" class="icon-button" id="cloudCloseButton" aria-label="${esc(cloudText('close'))}">${icon('close')}</button></div><div class="cloud-modal-body"><div id="cloudStatus" class="cloud-status-box">${esc(cloudText('loading'))}</div></div></section>`;layer.setAttribute('aria-hidden','false');layer.addEventListener('click',async event=>{if(event.target===layer){layer.remove();return}const button=event.target.closest('[data-cloud-action],#cloudCloseButton');if(!button)return;const action=button.dataset.cloudAction||(button.id==='cloudCloseButton'?'close':'');if(action==='close'){layer.remove();return}if(action==='toggle-mode'){cloudAuthMode=cloudAuthMode==='login'?'signup':'login';renderCloudModal();return}if(action==='google'||action==='microsoft'){try{const client=await getCloudClient();const provider=action==='google'?'google':'azure';const {error}=await client.auth.signInWithOAuth({provider,options:{redirectTo:window.location.origin, ...(provider==='azure'?{scopes:'email'}:{})}});if(error)throw error;cloudSetStatus(cloudText('loading'),'info')}catch(error){cloudSetStatus(error.message||cloudText('oauthFail'),'error')}return}if(action==='forgot'){const email=$('#cloudEmail')?.value?.trim();if(!email){cloudSetStatus(cloudText('email')+': —','warning');return}try{const client=await getCloudClient();const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});if(error)throw error;cloudSetStatus(cloudText('passwordReset'),'success')}catch(error){cloudSetStatus(error.message||cloudText('authFail'),'error')}return}if(action==='signout'){try{const client=await getCloudClient();const {error}=await client.auth.signOut();if(error)throw error;cloudSession=null;cloudLastHandledUser='';cloudSyncReady=false;cloudSyncStatus='local';updateCloudAccountButton();renderCloudModal();cloudSetStatus(cloudText('signoutOk'),'success')}catch(error){cloudSetStatus(error.message||cloudText('authFail'),'error')}return}if(action==='sync'){await pushCloudWorkspace();return}if(action==='reload'){await reloadCloudWorkspace();return}});try{if(cloudConfigured()){await getCloudClient();renderCloudModal()}else renderCloudModal()}catch(error){renderCloudModal();cloudSetStatus(error.message||cloudText('authFail'),'error')}const first=layer.querySelector('input');if(first)first.focus()}
  // Local saves remain authoritative. Once a user explicitly signs in, an opt-in cloud snapshot is
  // created under their authenticated Supabase user ID with optimistic revision checks and RLS.
  $('#cloudAccountButton')?.addEventListener('click',openCloudAccount);
  function startCloudAuth(){if(!cloudConfigured())return;getCloudClient().catch(error=>{cloudSyncStatus='error';console.warn('Cloud authentication is not available:',error.message)})}
  window.addEventListener('online',()=>{if(cloudSession&&!cloudSyncConflict)pushCloudWorkspace().catch(()=>{})});

  document.addEventListener('click',e=>{const routeEl=e.target.closest('[data-route]');if(routeEl){e.preventDefault();go(routeEl.dataset.route);return}const act=e.target.closest('[data-action]');if(act){e.preventDefault();handleAction(act)}});
  $('#mobileAdd').addEventListener('click',()=>openTransactionModal());$('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#notificationButton').addEventListener('click',e=>{e.stopPropagation();toggleNotifications()});document.addEventListener('click',e=>{const p=$('#notificationsPanel');if(p&&!p.contains(e.target)&&!$('#notificationButton').contains(e.target))p.classList.remove('open');const pop=$('#rangePopover');if(pop&&!pop.contains(e.target)&&!e.target.closest('[data-action="range"]'))pop.remove()});
  $('#topLanguage').addEventListener('change',e=>{const next=['it','en','es'].includes(e.target.value)?e.target.value:'it';state.settings.lang=next;save();renderApp();toast(t('languageChanged'))});$('#globalSearch').addEventListener('focus',()=>{if(route!=='transactions'){transactionFilters.query='';}});$('#globalSearch').addEventListener('input',e=>{transactionFilters.query=e.target.value;go('transactions');const input=$('#transactionSearch');if(input){input.value=e.target.value;input.focus()}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape'){modalClose();$('#notificationsPanel')?.classList.remove('open');$('#sidebar').classList.remove('open');$('#rangePopover')?.remove()}});
  $('#year').textContent=String(new Date().getFullYear());load();renderApp();updateCloudAccountButton();startCloudAuth();window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state?.settings?.theme==='system')applySettings()});if(!storageAvailable)setTimeout(()=>toast(t('storageUnavailable'),'error'),350);
})();
